
name: Pyntch Static Analysis

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  static-analysis:
    name: Analyze Python source using Pyntch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "2.7"

      - name: Download Pyntch
        run: |
          git clone https://github.com/euske/pyntch.git

      - name: Install Pyntch
        run: |
          cd pyntch
          python setup.py install

      - name: Run Pyntch analysis
        continue-on-error: true
        run: |
          cd backend
          python ../pyntch/tchecker.py \
            -p . \
            app.py models.py

      - name: Analysis completed
        if: always()
        run: echo "Pyntch analysis step completed."
